name: Reference toon multi-topic render test
on:
  workflow_dispatch:
  push:
    branches:
      - feat/reference-inspired-remotion-kaggle-poc
    paths:
      - 'animation-poc/**'
      - '.github/workflows/reference-earth-alien-render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Initialise the pinned Remotion reference renderer
        run: git submodule update --init --depth=1 animation-poc/upstream

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install FFmpeg metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Remotion and Three.js dependencies
        working-directory: animation-poc
        run: npm install --no-audit --no-fund

      - name: Type-check the topic engine
        working-directory: animation-poc
        run: npx tsc --noEmit

      - name: Render Earth-to-alien topic
        working-directory: animation-poc
        run: npx remotion render src/index.ts EarthAlienReferencePOC out/earth-to-alien-reference-poc.mp4 --codec h264 --crf 20 --scale 0.5

      - name: Render a different topic using the same engine
        working-directory: animation-poc
        run: npx remotion render src/index.ts HistoryPyramidReferencePOC out/history-pyramid-reference-poc.mp4 --codec h264 --crf 20 --scale 0.5

      - name: Verify both MP4 files and metadata
        working-directory: animation-poc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for name in earth-to-alien-reference-poc history-pyramid-reference-poc; do
            file="out/${name}.mp4"
            test -s "$file"
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json "$file" > "out/${name}.ffprobe.json"
            node - "$name" <<'NODE'
          const fs = require("node:fs");
          const name = process.argv[2];
          const data = JSON.parse(fs.readFileSync(`out/${name}.ffprobe.json`, "utf8"));
          const stream = data.streams?.[0];
          const duration = Number(data.format?.duration);
          const errors = [];
          if (stream?.codec_name !== "h264") errors.push("codec must be h264");
          if (stream?.width !== 540 || stream?.height !== 960) errors.push("resolution must be 540x960");
          if (stream?.r_frame_rate !== "30/1") errors.push("frame rate must be 30 fps");
          if (!Number.isFinite(duration) || Math.abs(duration - 13) > 0.05) errors.push("duration must be 13 seconds");
          if (errors.length) { console.error(name + ": " + errors.join("; ")); process.exit(1); }
          console.log(name + ": " + duration + "s, " + stream.width + "x" + stream.height + ", " + stream.codec_name + ", " + stream.r_frame_rate);
          NODE
          done

      - uses: actions/upload-artifact@v7
        with:
          name: reference-topic-engine-two-topic-proof
          path: animation-poc/out/
          retention-days: 7
