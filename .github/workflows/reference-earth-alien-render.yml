name: Reference toon single-topic render test
on:
  workflow_dispatch:
  push:
    branches:
      - feat/reference-inspired-remotion-kaggle-poc
    paths:
      - 'animation-poc/**'
      - '.github/workflows/reference-earth-alien-render.yml'
permissions:
  contents: read
concurrency:
  group: reference-topic-render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Initialise the pinned Remotion reference renderer
        run: git submodule update --init --depth=1 animation-poc/upstream

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install FFmpeg metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install frame QA dependencies
        run: python -m venv .qa-venv && .qa-venv/bin/pip install numpy pillow

      - name: Install Remotion and Three.js dependencies
        working-directory: animation-poc
        run: npm install --no-audit --no-fund

      - name: Type-check the topic engine
        working-directory: animation-poc
        run: npx tsc --noEmit

      - name: Render the first topic test (Earth to alien)
        working-directory: animation-poc
        run: npx remotion render src/index.ts EarthAlienReferencePOC out/earth-to-alien-reference-poc.mp4 --codec h264 --crf 20 --scale 0.5

      - name: Run frame QA for Earth-to-alien only
        working-directory: animation-poc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/qa
          node <<'NODE'
          const fs = require("node:fs");
          const slug = "earth-to-alien";
          const story = JSON.parse(fs.readFileSync(`src/${slug}.story.json`, "utf8"));
          const shots = story.scenes.map((scene, index) => ({
            id: index + 1,
            a: Math.round(scene.startSeconds * story.fps),
            b: Math.round((scene.startSeconds + scene.durationSeconds) * story.fps),
          }));
          const xfade = story.scenes.flatMap((scene, index) => {
            const n = scene.camera.transition === "crossfade" ? (scene.camera.transitionFrames ?? 8) : 0;
            if (index === 0 || n <= 0) return [];
            const at = Math.round(scene.startSeconds * story.fps);
            return [[at - Math.floor(n / 2), at + Math.ceil(n / 2)]];
          });
          fs.writeFileSync(`out/qa/${slug}-shots.json`, JSON.stringify({shots, xfade}, null, 2));
          NODE
          # The virtualenv is created at the repository root; this step runs from animation-poc.
          ../.qa-venv/bin/python upstream/templates/scripts/short_qa.py out/earth-to-alien-reference-poc.mp4 out/qa/earth-to-alien out/qa/earth-to-alien-shots.json
          node <<'NODE'
          const fs = require("node:fs");
          const report = fs.readFileSync("out/qa/earth-to-alien/report.md", "utf8");
          const frameLine = report.split("\\n").find(line => line.startsWith("FRAMES "));
          console.log("Earth-to-alien QA: " + frameLine);
          const match = frameLine?.match(/black (\\[[^\\]]*\\]); unplanned white (\\[[^\\]]*\\]); frozen spans >=12f (\\[[^\\]]*\\])/);
          if (!match) throw new Error("Could not parse frame QA summary");
          const black = JSON.parse(match[1]);
          const white = JSON.parse(match[2]);
          const frozen = match[3] !== "[]";
          if (black.length || white.length || frozen) throw new Error("Earth-to-alien has black/white/frozen frames; inspect contact sheets");
          NODE

      - name: Verify the Earth-to-alien MP4 and metadata
        working-directory: animation-poc
        shell: bash
        run: |
          set -euo pipefail
          file="out/earth-to-alien-reference-poc.mp4"
          test -s "$file"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json "$file" > out/earth-to-alien-reference-poc.ffprobe.json
          node <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync("out/earth-to-alien-reference-poc.ffprobe.json", "utf8"));
          const stream = data.streams?.[0];
          const duration = Number(data.format?.duration);
          const errors = [];
          if (stream?.codec_name !== "h264") errors.push("codec must be h264");
          if (stream?.width !== 540 || stream?.height !== 960) errors.push("resolution must be 540x960");
          if (stream?.r_frame_rate !== "30/1") errors.push("frame rate must be 30 fps");
          if (!Number.isFinite(duration) || Math.abs(duration - 13) > 0.05) errors.push("duration must be 13 seconds");
          if (errors.length) throw new Error(errors.join("; "));
          console.log("Earth-to-alien: " + duration + "s, " + stream.width + "x" + stream.height + ", " + stream.codec_name + ", " + stream.r_frame_rate);
          NODE

      - uses: actions/upload-artifact@v7
        with:
          name: earth-to-alien-single-test-proof
          path: animation-poc/out/
          retention-days: 7
