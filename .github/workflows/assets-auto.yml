name: Assets auto (draw missing backgrounds and props, judge, redraw, save to Kaggle dataset, verify)
# A script in scripts_in/*.txt -> the reader lists what the asset library lacks -> Kaggle draws it (style references come from the
# Kaggle dataset) -> code judges every picture, failed ones are redrawn (3 rounds) -> accepted ones go into the dataset
# -> the dataset is downloaded again into a clean folder and the new ids are verified. No person in the middle.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script file(s), space separated"
        default: scripts_in/example_bomb.txt
      refs:
        description: "Style reference pictures for NEW places: 1 = yes, 0 = no (default; only continuation scenes use a reference)"
        default: "0"
      reuse:
        description: "1 = judge the pictures an earlier run drew (no new drawing)"
        default: "0"
      redo:
        description: "Drawing ids to replace (space separated), optional"
        default: ""
  push:
    branches: [test/image-to-3d-objects]
    paths: ['scripts_in/**', '.github/workflows/assets-auto.yml']

concurrency:
  group: kaggle-notebook-scene-batch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - run: python -m pip install numpy pillow scipy pytest kaggle==2.2.5 six
      - name: Unit tests
        run: python -m pytest -q
        env:
          PYTHONPATH: .
      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then echo "Missing Kaggle secrets"; exit 1; fi
          mkdir -p "$HOME/.kaggle"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path.home().joinpath(".kaggle", "kaggle.json").write_text(json.dumps({
              "username": os.environ["KAGGLE_USERNAME"].strip(), "key": os.environ["KAGGLE_KEY"].strip()}))
          PY
          chmod 600 "$HOME/.kaggle/kaggle.json"
      - name: Run the asset loop for every changed script
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          PYTHONPATH: .
          INPUT_SCRIPT: ${{ github.event.inputs.script }}
          REDO: ${{ github.event.inputs.redo }}
          ASSET_REFS: ${{ github.event.inputs.refs || '0' }}
          REUSE: ${{ github.event.inputs.reuse || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SCRIPTS=$(git diff --name-only HEAD^ HEAD -- scripts_in | grep '\.txt$' || true)
            [ -z "$SCRIPTS" ] && SCRIPTS=$(ls scripts_in/*.txt)
          else
            SCRIPTS="$INPUT_SCRIPT"
          fi
          for S in $SCRIPTS; do scripts/run_assets_auto.sh "$S"; done
      - name: Upload everything as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assets-auto-output
          path: assets-state/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish the drawn pictures to the test-results branch
        if: always()
        run: |
          [ -d assets-state ] || { echo "nothing to publish"; exit 0; }
          if git ls-remote --exit-code --heads origin test-results >/dev/null; then
            git fetch --depth 1 origin test-results
            git worktree add /tmp/results FETCH_HEAD
            cd /tmp/results && git checkout -B test-results
          else
            exit 0
          fi
          for D in "$GITHUB_WORKSPACE"/assets-state/*; do
            N=$(basename "$D"); mkdir -p "assets-auto/$N"
            cp "$D"/candidates/*.png "assets-auto/$N"/ 2>/dev/null || true
            cp "$D"/report.json "$D"/reader.txt "$D"/reader_after.txt "$D"/verify.json "assets-auto/$N"/ 2>/dev/null || true
            for F in "$GITHUB_WORKSPACE"/animation/asset_library/backgrounds/*.png "$GITHUB_WORKSPACE"/animation/asset_library/objects/*.png; do :; done
          done
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets-auto; git commit -q -m "Assets auto output, workflow run ${{ github.run_id }}" || { echo "nothing new"; exit 0; }
          for TRY in 1 2 3 4 5; do
            if git push -q origin test-results; then echo "Published to test-results: assets-auto/"; exit 0; fi
            echo "push try $TRY failed"; sleep $((15 * TRY))
            git fetch -q --depth 1 origin test-results && git rebase -q FETCH_HEAD || true
          done
          exit 1
