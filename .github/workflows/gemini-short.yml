name: Gemini cartoon short (script -> Kokoro voice -> Gemini writes the scenes -> render -> mp4)
on:
  push:
    branches: [gemini-cartoon]
    paths: ['.github/workflows/gemini-short.yml']     # only registers the workflow; the job runs on "Run workflow"
  workflow_dispatch:
    inputs:
      script:
        description: "Script file"
        default: scripts/example_pig_war.txt
      model:
        description: "Gemini model (a free API key allows Flash models only)"
        default: gemini-3.8-flash

permissions:
  contents: write

jobs:
  short:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m pip install -q numpy pillow kokoro-onnx soundfile
      - name: Install Gemini CLI and Playwright Chromium
        run: |
          npm install -g @google/gemini-cli playwright
          npx playwright install --with-deps chromium
          gemini --version
      - uses: actions/cache@v4
        id: models
        with:
          path: models
          key: kokoro-v1.0
      - name: Kokoro voice model
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          for F in kokoro-v1.0.onnx voices-v1.0.bin; do curl -sSL --retry 4 -o "models/$F" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$F"; done
      - name: New project + voice
        env:
          SCRIPT: ${{ github.event.inputs.script }}
        run: |
          bash kit/tools/setup.sh "$PWD/project"
          cp kit/tools/mix.py kit/tools/finish.sh project/
          cp GEMINI.md project/GEMINI.md
          mkdir -p project/skills/cartoon-audio-short && cp skills/cartoon-audio-short/SKILL.md project/skills/cartoon-audio-short/
          cp -r kit project/kit
          python tools/make_voice.py "$SCRIPT" project models
      - name: Gemini writes the scenes (plan, world, cast, cameras, sound) and checks stills
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ github.event.inputs.model }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
          GCP_API_KEY: ${{ secrets.GCP_API_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ] && [ -n "$GCP_PROJECT_ID" ]; then
            # Google Cloud (Vertex AI): paid from the $300 free-trial credit, higher limits than the free API key
            printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" GOOGLE_CLOUD_PROJECT="$GCP_PROJECT_ID" GOOGLE_CLOUD_LOCATION="${GCP_LOCATION:-global}" GOOGLE_GENAI_USE_VERTEXAI=true
            unset GEMINI_API_KEY
            echo "Using Vertex AI, project $GCP_PROJECT_ID, location ${GCP_LOCATION:-global}"
          elif [ -n "$GCP_API_KEY" ] && [ -n "$GCP_PROJECT_ID" ]; then
            # Google Cloud (Vertex AI) with an API key (used when the organisation blocks service-account key files)
            export GOOGLE_API_KEY="$GCP_API_KEY" GOOGLE_CLOUD_PROJECT="$GCP_PROJECT_ID" GOOGLE_CLOUD_LOCATION="${GCP_LOCATION:-global}" GOOGLE_GENAI_USE_VERTEXAI=true
            unset GEMINI_API_KEY
            echo "Using Vertex AI with an API key, project $GCP_PROJECT_ID"
          elif [ -z "$GEMINI_API_KEY" ]; then echo "No GCP_SA_KEY/GCP_PROJECT_ID and no GEMINI_API_KEY secret"; exit 1
          else echo "Using the free Gemini API key"; fi
          cd project
          mkdir -p ~/.gemini && cp "$GITHUB_WORKSPACE/.gemini/settings.json" ~/.gemini/settings.json   # stops the 400 "ending with a model turn" crash
          for TRY in 1 2 3 4 5 6; do                 # the free tier is sometimes "busy" (503): wait and try again, the files written so far are kept
            echo "=== Gemini try $TRY ===" | tee -a ../gemini.log
            timeout 200m gemini -m "$MODEL" --yolo --skip-trust -p "$(cat ../tools/gemini_task.md) If work/ already has files from an earlier try, continue from them." 2>&1 | tee -a ../gemini.log || true
            [ -f work/DONE.txt ] && break
            if grep -q "exhausted your daily quota" ../gemini.log; then echo "Daily quota used up: stopping (no point waiting)"; break; fi
            if tail -n 40 ../gemini.log | grep -q "ending with a model turn"; then echo "Gemini CLI hiccup (400): starting again from the saved files"; sleep 20; continue; fi
            grep -q "high demand\|503\|fetch failed" ../gemini.log && { echo "Gemini busy, waiting 6 minutes"; sleep 360; } || break
          done
          ls work stills 2>/dev/null || true
          if [ ! -f work/DONE.txt ]; then echo "Gemini did not finish (no work/DONE.txt): stopping, so the kit's example is never rendered by mistake"; tail -40 ../gemini.log; exit 1; fi
      - name: Plan the parallel render
        id: plan
        run: |
          cd project
          [ -f mix_raw.wav ] || python3 mix.py voice.mp3        # voice only if the sound step was not done
          N=$(node -e "import('./web/story.js').then(m=>console.log(m.TOTAL))")
          P=$(( (N + 149) / 150 )); [ "$P" -gt 10 ] && P=10; [ "$P" -lt 1 ] && P=1
          IDX=$(python3 -c "print(list(range($P)))")      # no curly braces: GitHub hides output that contains a character of a secret
          echo "frames $N in $P parts"
          echo "idx=$IDX" >> "$GITHUB_OUTPUT"; echo "n=$N" >> "$GITHUB_OUTPUT"; echo "p=$P" >> "$GITHUB_OUTPUT"
          cd .. && tar --exclude=project/node_modules -cf project.tar project gemini.log
      - uses: actions/upload-artifact@v4
        with:
          name: project
          path: project.tar
          retention-days: 3
    outputs:
      idx: ${{ steps.plan.outputs.idx }}
      n: ${{ steps.plan.outputs.n }}
      p: ${{ steps.plan.outputs.p }}

  render:
    needs: short
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      i: ${{ fromJSON(needs.short.outputs.idx) }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g playwright && npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: project
      - name: Render part ${{ matrix.i }}
        run: |
          tar xf project.tar && cd project
          mkdir -p node_modules && ln -sf "$(npm root -g)/playwright" node_modules/playwright
          N=${{ needs.short.outputs.n }}; P=${{ needs.short.outputs.p }}; I=${{ matrix.i }}
          STEP=$(( (N + P - 1) / P )); A=$(( I * STEP )); B=$(( (I + 1) * STEP - 1 )); [ "$B" -gt $((N-1)) ] && B=$((N-1))
          echo "rendering frames $A-$B"
          node render.mjs frames "$A-$B"
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.i }}
          path: project/frames/
          retention-days: 3

  finish:
    needs: [short, render]
    if: always() && needs.short.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: project
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: project/frames
          merge-multiple: true
      - name: Join frames + sound into the mp4 and check it
        run: |
          tar xf project.tar --skip-old-files
          cd project && ls frames | wc -l && mkdir -p out && bash finish.sh "short"
      - name: Publish the result to results/<script name>/ on this branch
        if: always()
        env:
          SCRIPT: ${{ github.event.inputs.script }}
        run: |
          NAME=$(basename "$SCRIPT" .txt); D="results/$NAME"; mkdir -p "$D"
          cp project/out/*.mp4 project/out/qa_sheet.jpg "$D"/ 2>/dev/null || true
          cp project/stills/sheet_*.jpg project/work/PLAN.md project/work/DONE.txt project/work/NOTES.md "$D"/ 2>/dev/null || true
          cp project/web/story.js "$D/story.js" 2>/dev/null || true
          tail -200 gemini.log > "$D/gemini_log_tail.txt" 2>/dev/null || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results; git commit -q -m "Result $NAME, run ${{ github.run_id }} [skip ci]" || exit 0
          for T in 1 2 3; do git pull -q --rebase origin gemini-cartoon && git push -q origin HEAD:gemini-cartoon && break; sleep 10; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: results/
          retention-days: 14
