name: tests

on:
  push:
    branches: [main, pipeline-foundation, comfyui-integration]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .

  submit-kaggle-gpu-smoke-test:
    name: Submit Kaggle GPU smoke test
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/comfyui-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Prepare private Kaggle notebook metadata
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "Missing GitHub Actions secret: KAGGLE_USERNAME"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path

          username = os.environ["KAGGLE_USERNAME"].strip()
          if not username or "/" in username:
              raise SystemExit("KAGGLE_USERNAME must be your Kaggle account slug.")
          metadata = {
              "id": f"{username}/stickman-motion-studio-gpu-smoke-test",
              "title": "Stickman Motion Studio GPU Smoke Test",
              "code_file": "gpu_smoke_test.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          Path("kaggle/gpu-smoke-test/kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\\n", encoding="utf-8"
          )
          print(f"Prepared private Kaggle notebook: {metadata['id']}")
          PY

      - name: Submit notebook to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: KAGGLE_API_TOKEN"
            exit 1
          fi
          kaggle kernels push --path kaggle/gpu-smoke-test --timeout 3600
