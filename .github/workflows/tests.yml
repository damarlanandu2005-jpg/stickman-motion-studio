name: tests

# Image-generation notebook startup try/except is now syntactically complete.

concurrency:
  group: comfyui-kaggle-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, pipeline-foundation, comfyui-integration]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .

  comfyui-kaggle-smoke-test:
    name: Run ComfyUI smoke test on Kaggle
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/comfyui-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Prepare private Kaggle notebook metadata
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "Missing GitHub Actions secret: KAGGLE_USERNAME"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path

          username = os.environ["KAGGLE_USERNAME"].strip()
          if not username or "/" in username:
              raise SystemExit("KAGGLE_USERNAME must be your Kaggle account slug.")
          metadata = {
              "id": f"{username}/stickman-motion-studio-comfyui-server-smoke-test",
              "title": "Stickman Motion Studio ComfyUI Server Smoke Test",
              "code_file": "comfyui_smoke_test.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          Path("kaggle/comfyui-smoke-test/kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Prepared private Kaggle notebook: {metadata['id']}")
          PY

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Missing GitHub Actions secrets: KAGGLE_USERNAME and/or KAGGLE_KEY"
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          python - <<'PY'
          import json, os
          from pathlib import Path
          credentials = {
              "username": os.environ["KAGGLE_USERNAME"].strip(),
              "key": os.environ["KAGGLE_KEY"].strip()
          }
          Path.home().joinpath(".kaggle", "kaggle.json").write_text(
              json.dumps(credentials), encoding="utf-8"
          )
          PY
          chmod 600 "$HOME/.kaggle/kaggle.json"

      - name: Submit ComfyUI notebook and start Kaggle execution
        run: kaggle kernels push --path kaggle/comfyui-smoke-test --timeout 3600

      - name: Wait for Kaggle execution and verify notebook report
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          kernel = f"{os.environ['KAGGLE_USERNAME'].strip()}/stickman-motion-studio-comfyui-server-smoke-test"
          output_dir = Path("kaggle-comfyui-output")
          output_dir.mkdir(exist_ok=True)
          status_file = output_dir / "kaggle-status.txt"
          log_file = output_dir / "kaggle-execution.log"

          terminal = {"COMPLETE", "ERROR", "CANCEL_ACKNOWLEDGED"}
          deadline = time.monotonic() + 55 * 60
          last_status = None
          transient_failures = 0

          while time.monotonic() < deadline:
              result = subprocess.run(
                  ["kaggle", "kernels", "status", kernel],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
              )
              status_text = result.stdout.strip()
              status_file.write_text(status_text + "\n", encoding="utf-8")
              match = re.search(r"KernelWorkerStatus\.([A-Z_]+)", status_text)
              if result.returncode != 0 or not match:
                  transient_failures += 1
                  print(status_text or "Kaggle status returned no output")
                  if transient_failures >= 5:
                      raise SystemExit("Could not read Kaggle execution status after 5 attempts.")
                  time.sleep(20)
                  continue

              transient_failures = 0
              state = match.group(1)
              if state != last_status:
                  print(f"Kaggle execution state: {state}")
                  last_status = state

              if state in terminal:
                  break
              time.sleep(30)
          else:
              raise SystemExit("Timed out after 55 minutes waiting for Kaggle execution.")

          if state == "COMPLETE" and not observed_active_execution:
              raise SystemExit(
                  "Kaggle reported COMPLETE without this workflow observing QUEUED/RUNNING. "
                  "Refusing to accept a possibly stale result from an older notebook execution."
              )

          if state != "COMPLETE":
              logs = subprocess.run(
                  ["kaggle", "kernels", "logs", kernel],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
              )
              log_file.write_text(logs.stdout, encoding="utf-8")
              print(logs.stdout[-12000:])
              raise SystemExit(f"Kaggle notebook finished with terminal state: {state}")

          download = subprocess.run(
              ["kaggle", "kernels", "output", kernel, "--path", str(output_dir)],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
          )
          print(download.stdout)
          if download.returncode != 0:
              raise SystemExit("Kaggle run completed but downloading its output failed.")

          reports = list(output_dir.rglob("comfyui-smoke-test.json"))
          if not reports:
              logs = subprocess.run(
                  ["kaggle", "kernels", "logs", kernel],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
              )
              log_file.write_text(logs.stdout, encoding="utf-8")
              raise SystemExit("Kaggle run completed but comfyui-smoke-test.json was not found.")

          report_path = reports[0]
          report = json.loads(report_path.read_text(encoding="utf-8"))
          required_true = [
              "comfyui_started",
              "api_system_stats_ok",
              "api_object_info_ok",
              "cuda_available",
          ]
          failures = [key for key in required_true if report.get(key) is not True]
          node_count = report.get("node_type_count", 0)
          if not isinstance(node_count, int) or node_count < 1:
              failures.append("node_type_count (expected integer >= 1)")

          print(json.dumps(report, indent=2))
          if failures:
              raise SystemExit("ComfyUI smoke test report failed checks: " + ", ".join(failures))
          print(f"PASS: Kaggle execution completed and report verified: {report_path}")
          PY

      - name: Collect Kaggle execution logs on failure
        if: failure()
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          mkdir -p kaggle-comfyui-output
          KERNEL="$KAGGLE_USERNAME/stickman-motion-studio-comfyui-server-smoke-test"
          kaggle kernels status "$KERNEL" > kaggle-comfyui-output/kaggle-status-final.txt 2>&1 || true
          kaggle kernels logs "$KERNEL" > kaggle-comfyui-output/kaggle-execution.log 2>&1 || true
          tail -n 200 kaggle-comfyui-output/kaggle-execution.log || true

      - name: Upload Kaggle execution report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-kaggle-smoke-test-output
          path: kaggle-comfyui-output/
          if-no-files-found: warn
          retention-days: 14

  image-generation-kaggle-smoke-test:
    name: Generate a real image on Kaggle with ComfyUI
    needs: comfyui-kaggle-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/comfyui-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Prepare private Kaggle notebook metadata
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "Missing GitHub Actions secret: KAGGLE_USERNAME"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          username = os.environ["KAGGLE_USERNAME"].strip()
          if not username or "/" in username:
              raise SystemExit("KAGGLE_USERNAME must be your Kaggle account slug.")
          metadata = {
              "id": f"{username}/stickman-motion-studio-image-generation-smoke-test",
              "title": "Stickman Motion Studio Image Generation Smoke Test",
              "code_file": "image_generation_smoke_test.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          Path("kaggle/image-generation-smoke-test/kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Prepared private Kaggle notebook: {metadata['id']}")
          PY

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Missing GitHub Actions secrets: KAGGLE_USERNAME and/or KAGGLE_KEY"
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          python - <<'PY'
          import json, os
          from pathlib import Path
          credentials = {
              "username": os.environ["KAGGLE_USERNAME"].strip(),
              "key": os.environ["KAGGLE_KEY"].strip()
          }
          Path.home().joinpath(".kaggle", "kaggle.json").write_text(
              json.dumps(credentials), encoding="utf-8"
          )
          PY
          chmod 600 "$HOME/.kaggle/kaggle.json"

      - name: Submit image-generation notebook to Kaggle
        run: kaggle kernels push --path kaggle/image-generation-smoke-test --timeout 3600

      - name: Wait for Kaggle generation and verify report plus PNG
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path

          kernel = f"{os.environ['KAGGLE_USERNAME'].strip()}/stickman-motion-studio-image-generation-smoke-test"
          output_dir = Path("kaggle-image-generation-output")
          output_dir.mkdir(exist_ok=True)
          terminal = {"COMPLETE", "ERROR", "CANCEL_ACKNOWLEDGED", "NEW_SCRIPT"}
          deadline = time.monotonic() + 85 * 60
          last_state = None
          transient_failures = 0
          observed_active_execution = False

          while time.monotonic() < deadline:
              result = subprocess.run(
                  ["kaggle", "kernels", "status", kernel],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
              )
              status_text = result.stdout.strip()
              (output_dir / "kaggle-status.txt").write_text(status_text + "\n", encoding="utf-8")
              match = re.search(r"KernelWorkerStatus\.([A-Z_]+)", status_text)
              if result.returncode != 0 or not match:
                  transient_failures += 1
                  print(status_text or "Kaggle status returned no output")
                  if transient_failures >= 5:
                      raise SystemExit("Could not read Kaggle execution status after 5 attempts.")
                  time.sleep(20)
                  continue
              transient_failures = 0
              state = match.group(1)
              print(f"Kaggle image-generation state at {time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}: {state}")
              if state in {"QUEUED", "RUNNING"}:
                  observed_active_execution = True
              if state != last_state:
                  last_state = state
              if state in terminal:
                  break
              time.sleep(30)
          else:
              raise SystemExit("Timed out after 85 minutes waiting for Kaggle image generation.")

          if state != "COMPLETE":
              logs = subprocess.run(
                  ["kaggle", "kernels", "logs", kernel],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
              )
              (output_dir / "kaggle-execution.log").write_text(logs.stdout, encoding="utf-8")
              print(logs.stdout[-16000:])
              raise SystemExit(f"Kaggle image-generation notebook ended with state: {state}")

          download = subprocess.run(
              ["kaggle", "kernels", "output", kernel, "--path", str(output_dir)],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
          )
          print(download.stdout)
          if download.returncode != 0:
              raise SystemExit("Kaggle run completed but output download failed.")

          reports = list(output_dir.rglob("image-generation-smoke-test.json"))
          images = list(output_dir.rglob("stickman-motion-studio-generated.png"))
          if not reports or not images:
              raise SystemExit("Kaggle completed but the required JSON report or generated PNG is missing.")

          report = json.loads(reports[0].read_text(encoding="utf-8"))
          required_true = [
              "comfyui_started", "api_system_stats_ok", "api_object_info_ok",
              "required_nodes_present", "image_generation_completed", "image_saved",
              "model_sha256_verified", "cuda_available"
          ]
          failures = [key for key in required_true if report.get(key) is not True]
          if report.get("image_dimensions") != [512, 512]:
              failures.append("image_dimensions (expected 512x512)")
          if not isinstance(report.get("image_bytes"), int) or report["image_bytes"] <= 10000:
              failures.append("image_bytes (expected > 10000)")
          if report.get("output_file") != images[0].name:
              failures.append("output_file does not match downloaded PNG")
          print(json.dumps({k:v for k,v in report.items() if k != "system_stats"}, indent=2))
          print(f"Generated PNG: {images[0]} ({images[0].stat().st_size} bytes)")
          if failures:
              raise SystemExit("Image-generation report failed checks: " + ", ".join(failures))
          print("PASS: Kaggle generated a real 512x512 PNG and the model hash/report were verified.")
          PY

      - name: Collect Kaggle logs on failure
        if: failure()
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          mkdir -p kaggle-image-generation-output
          KERNEL="$KAGGLE_USERNAME/stickman-motion-studio-image-generation-smoke-test"
          kaggle kernels status "$KERNEL" > kaggle-image-generation-output/kaggle-status-final.txt 2>&1 || true
          kaggle kernels logs "$KERNEL" > kaggle-image-generation-output/kaggle-execution.log 2>&1 || true
          tail -n 250 kaggle-image-generation-output/kaggle-execution.log || true

      - name: Upload generated image, report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-image-generation-smoke-test-output
          path: kaggle-image-generation-output/
          if-no-files-found: warn
          retention-days: 14
