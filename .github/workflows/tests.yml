name: tests

# Unit tests only. GPU runs on Kaggle are started manually through
# .github/workflows/kaggle-image-smoke.yml (one run per notebook at a time).

on:
  push:
    branches: [main, pipeline-foundation, comfyui-integration]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .
