name: tests

on:
  push:
    branches: [main, pipeline-foundation, comfyui-integration]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .

  submit-kaggle-gpu-smoke-test:
    name: Submit Kaggle GPU smoke test
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/comfyui-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Prepare private Kaggle notebook metadata
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "Missing GitHub Actions secret: KAGGLE_USERNAME"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path

          username = os.environ["KAGGLE_USERNAME"].strip()
          if not username or "/" in username:
              raise SystemExit("KAGGLE_USERNAME must be your Kaggle account slug.")
          metadata = {
              "id": f"{username}/stickman-motion-studio-gpu-smoke-test",
              "title": "Stickman Motion Studio GPU Smoke Test",
              "code_file": "gpu_smoke_test.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          Path("kaggle/gpu-smoke-test/kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Prepared private Kaggle notebook: {metadata['id']}")

          comfyui_metadata = {
              "id": f"{username}/stickman-motion-studio-comfyui-smoke-test",
              "title": "Stickman Motion Studio ComfyUI Server Smoke Test",
              "code_file": "comfyui_smoke_test.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          Path("kaggle/comfyui-smoke-test/kernel-metadata.json").write_text(
              json.dumps(comfyui_metadata, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Prepared private Kaggle notebook: {comfyui_metadata['id']}")
          PY

      - name: Configure legacy Kaggle JSON credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Missing GitHub Actions secrets: KAGGLE_USERNAME and/or KAGGLE_KEY"
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          python - <<'PY'
          import json, os
          from pathlib import Path

          credentials = {
              "username": os.environ["KAGGLE_USERNAME"].strip(),
              "key": os.environ["KAGGLE_KEY"].strip()
          }
          Path.home().joinpath(".kaggle", "kaggle.json").write_text(
              json.dumps(credentials), encoding="utf-8"
          )
          PY
          chmod 600 "$HOME/.kaggle/kaggle.json"

      - name: Submit notebook to Kaggle
        run: echo "GPU smoke test already passed; skipping resubmission."

      - name: Submit ComfyUI server smoke test to Kaggle
        run: kaggle kernels push --path kaggle/comfyui-smoke-test --timeout 3600
