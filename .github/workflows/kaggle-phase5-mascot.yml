name: Kaggle Phase 5 mascot consistency test

# Manual dispatch only. Uses the existing serialized Kaggle runner and the same credential path.
on:
  workflow_dispatch:

concurrency:
  group: kaggle-notebook-phase5-mascot-consistency
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .

  phase5-on-kaggle:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: |
          python -m pip install kaggle==2.2.5 six
          kaggle --version
      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Missing GitHub Actions secrets KAGGLE_USERNAME and/or KAGGLE_KEY"; exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path.home().joinpath(".kaggle", "kaggle.json").write_text(json.dumps({
              "username": os.environ["KAGGLE_USERNAME"].strip(),
              "key": os.environ["KAGGLE_KEY"].strip()}))
          PY
          chmod 600 "$HOME/.kaggle/kaggle.json"
      - name: Push, track and verify the Phase 5 run
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          PYTHONPATH: .
        run: |
          python -m motion_studio.kaggle_runner \
            --kernel "$(echo "$KAGGLE_USERNAME" | tr -d '[:space:]')/stickman-motion-studio-phase5-mascot-consistency" \
            --title "Stickman Motion Studio Phase 5 Mascot Consistency" \
            --kernel-dir kaggle/phase5-mascot-consistency \
            --notebook phase5_mascot_consistency.ipynb \
            --out kaggle-phase5-mascot-output \
            --profile klein-benchmark
      - name: Upload report, images, contact sheet and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-mascot-consistency-output
          path: kaggle-phase5-mascot-output/
          if-no-files-found: warn
          retention-days: 14
