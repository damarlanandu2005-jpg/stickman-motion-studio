name: Ricks library (generate missing assets with Gemini)
on:
  push:
    branches: [ricks-stage-kaggle]
    paths: ['.github/workflows/ricks-library.yml']
  workflow_dispatch:
    inputs:
      only: { description: "ids to generate (comma list) or all", default: "all" }
permissions: { contents: write }
jobs:
  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install -q google-genai pillow numpy
      - name: Gemini generation
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IN_ONLY: ${{ github.event.inputs.only }}
        run: |
          [ -n "$GCP_SA_KEY" ] && [ -n "$GCP_PROJECT_ID" ] || { echo "GCP secrets missing"; exit 1; }
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" GOOGLE_CLOUD_PROJECT="$GCP_PROJECT_ID" GOOGLE_GENAI_USE_VERTEXAI=true
          python ricks/tools/gen_library.py ricks/library --only "$IN_ONLY" 2>&1 | tee -a ricks/library/raw/gen_log.txt || true
      - name: Commit results
        if: always()
        run: |
          git config user.name "claude-bot"; git config user.email "noreply@anthropic.com"
          git add -f ricks/library/raw
          git commit -m "Ricks library: generated assets [skip ci]" || exit 0
          git pull -q --rebase -X theirs origin ${{ github.ref_name }} || true
          git push -q origin HEAD:${{ github.ref_name }}
