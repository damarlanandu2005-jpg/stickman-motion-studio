name: Kaggle head-with-hat test (klein, image references)
# (head-hat test, first run)

# klein draws the owner's stickman head wearing a hat (test A: 20-head sheet, test B: single heads), from bare-head + hat reference pictures.
# One run per Kaggle notebook at a time (concurrency keyed on the notebook).
on:
  workflow_dispatch:

concurrency:
  group: kaggle-notebook-head-hat-test
  cancel-in-progress: false

permissions:
  contents: write  # only used to publish results to the separate test-results branch

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .
      - run: python scripts/build_headhat_notebook.py --check

  poses-on-kaggle:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          python -m pip install kaggle==2.2.5 six
          kaggle --version

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Missing GitHub Actions secrets KAGGLE_USERNAME and/or KAGGLE_KEY"; exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path.home().joinpath(".kaggle", "kaggle.json").write_text(json.dumps({
              "username": os.environ["KAGGLE_USERNAME"].strip(), "key": os.environ["KAGGLE_KEY"].strip()}))
          PY
          chmod 600 "$HOME/.kaggle/kaggle.json"

      - name: Push, track and verify the Kaggle run
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          PYTHONPATH: .
        run: |
          python -m motion_studio.kaggle_runner \
            --kernel "$(echo "$KAGGLE_USERNAME" | tr -d '[:space:]')/stickman-motion-studio-head-hat-test" \
            --title "Stickman Motion Studio Head Hat Test" \
            --kernel-dir kaggle/head-hat-test \
            --notebook head_hat_test.ipynb \
            --out kaggle-poses-output \
            --profile poses \
            --timeout-minutes 115 \
            --kaggle-run-limit-seconds 7200

      - name: Upload outputs as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head-hat-test-output
          path: kaggle-poses-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish outputs to the test-results branch
        if: always()
        env:
          RUN_DIR: head-hat-test/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ ! -d kaggle-poses-output ] || [ -z "$(ls -A kaggle-poses-output)" ]; then
            echo "No outputs to publish"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin test-results >/dev/null; then
            git fetch --depth 1 origin test-results
            git worktree add /tmp/results FETCH_HEAD
            cd /tmp/results && git checkout -B test-results
          else
            git worktree add --detach /tmp/results
            cd /tmp/results && git checkout --orphan test-results && git rm -rq --cached . && git clean -fdq
          fi
          mkdir -p "$RUN_DIR"
          cp -r "$GITHUB_WORKSPACE"/kaggle-poses-output/. "$RUN_DIR"/
          find "$RUN_DIR" -type f -size +90M -print -delete
          git add "$RUN_DIR"
          git commit -q -m "Head hat test outputs, workflow run ${{ github.run_id }}"
          git push -q origin test-results
          echo "Published to branch test-results: $RUN_DIR"
