name: Render a hand-built project (Claude's own version) in parallel
on:
  push:
    branches: [gemini-cartoon]
    paths: ['.github/workflows/render-mine.yml']     # only registers the workflow
  workflow_dispatch:
    inputs:
      project:
        description: "Folder under mine/ (has web/, voice.mp3, mix_raw.wav)"
        default: emu_war

permissions:
  contents: write

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.p.outputs.idx }}
      n: ${{ steps.p.outputs.n }}
      p: ${{ steps.p.outputs.p }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: p
        run: |
          cd "mine/${{ github.event.inputs.project }}"
          N=$(node -e "import('./web/story.js').then(m=>console.log(m.TOTAL))")
          P=$(( (N + 149) / 150 )); [ "$P" -gt 10 ] && P=10; [ "$P" -lt 1 ] && P=1
          echo "idx=$(python3 -c "print(list(range($P)))")" >> "$GITHUB_OUTPUT"; echo "n=$N" >> "$GITHUB_OUTPUT"; echo "p=$P" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJSON(needs.plan.outputs.idx) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g playwright && npx playwright install --with-deps chromium
      - name: Render part ${{ matrix.i }}
        run: |
          cd "mine/${{ github.event.inputs.project }}"
          mkdir -p web/lib /tmp/_three && (cd /tmp/_three && npm pack three@0.160.0 >/dev/null 2>&1 && tar xzf three-0.160.0.tgz && cp package/build/three.module.js "$GITHUB_WORKSPACE/mine/${{ github.event.inputs.project }}/web/lib/")
          mkdir -p node_modules && ln -sf "$(npm root -g)/playwright" node_modules/playwright
          N=${{ needs.plan.outputs.n }}; P=${{ needs.plan.outputs.p }}; I=${{ matrix.i }}
          STEP=$(( (N + P - 1) / P )); A=$(( I * STEP )); B=$(( (I + 1) * STEP - 1 )); [ "$B" -gt $((N-1)) ] && B=$((N-1))
          echo "rendering frames $A-$B"
          node render.mjs frames "$A-$B"
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.i }}
          path: mine/${{ github.event.inputs.project }}/frames/
          retention-days: 3

  finish:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && python3 -m pip install -q numpy pillow opencv-python-headless
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: mine/${{ github.event.inputs.project }}/frames
          merge-multiple: true
      - name: Join frames + sound into the mp4 and check it
        run: |
          cd "mine/${{ github.event.inputs.project }}" && cp "$GITHUB_WORKSPACE"/kit/tools/frame_qa.py "$GITHUB_WORKSPACE"/kit/tools/ref_measure.py . && mkdir -p kit && cp -r "$GITHUB_WORKSPACE"/kit/reference kit/ && ls frames | wc -l && mkdir -p out && bash "$GITHUB_WORKSPACE/kit/tools/finish.sh" "short"
      - name: Publish to results_claude/<project>/
        run: |
          D="results_claude/${{ github.event.inputs.project }}"; mkdir -p "$D"
          cp mine/${{ github.event.inputs.project }}/out/*.mp4 mine/${{ github.event.inputs.project }}/out/qa_sheet.jpg mine/${{ github.event.inputs.project }}/out/qa_report.txt mine/${{ github.event.inputs.project }}/out/ref_compare.txt "$D"/ 2>/dev/null || cp mine/${{ github.event.inputs.project }}/out/*.mp4 mine/${{ github.event.inputs.project }}/out/qa_sheet.jpg "$D"/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_claude; git commit -q -m "Claude version ${{ github.event.inputs.project }}, run ${{ github.run_id }} [skip ci]" || exit 0
          for T in 1 2 3; do git pull -q --rebase -X theirs origin gemini-cartoon && git push -q origin HEAD:gemini-cartoon && break; sleep 10; done
