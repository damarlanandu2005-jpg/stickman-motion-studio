name: Prompt format test (4 ways to write a prompt, 4 ways to ask for an edit)
# Same scene asked in plain sentences / short list / long paragraph / JSON. Edits of the rooftop-at-sunset picture asked 4 ways.
# Pictures go to test-results/prompt-test/ and are LOOKED AT by a person or by Claude. Nothing is judged by code.
on:
  push:
    branches: [test/image-to-3d-objects]
    paths: ['.github/workflows/prompt-test.yml', 'kaggle/prompt-test/**']
  workflow_dispatch:

concurrency:
  group: kaggle-notebook-scene-batch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pillow scipy kaggle==2.2.5 six
      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then echo "Missing Kaggle secrets"; exit 1; fi
          mkdir -p "$HOME/.kaggle"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path.home().joinpath(".kaggle", "kaggle.json").write_text(json.dumps({
              "username": os.environ["KAGGLE_USERNAME"].strip(), "key": os.environ["KAGGLE_KEY"].strip()}))
          PY
          chmod 600 "$HOME/.kaggle/kaggle.json"
      - name: Draw the test pictures
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          PYTHONPATH: .
        run: scripts/run_prompt_test.sh
      - name: Publish the pictures to the test-results branch
        if: always()
        run: |
          [ -d prompt-test-state/out ] || { echo "nothing to publish"; exit 0; }
          git fetch --depth 1 origin test-results
          git worktree add /tmp/results FETCH_HEAD
          cd /tmp/results && git checkout -B test-results
          mkdir -p prompt-test; find "$GITHUB_WORKSPACE/prompt-test-state/out" -name 'pose_*.png' -exec cp {} prompt-test/ \; ; cp "$GITHUB_WORKSPACE/kaggle/prompt-test/jobs.json" prompt-test/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompt-test; git commit -q -m "Prompt format test, run ${{ github.run_id }}" || { echo "nothing new"; exit 0; }
          for TRY in 1 2 3 4 5; do
            if git push -q origin test-results; then echo "Published prompt-test"; exit 0; fi
            sleep $((15 * TRY)); git fetch -q --depth 1 origin test-results && git rebase -q FETCH_HEAD || true
          done
          exit 1
