name: Make a hand-polish project from a Gemini v1 result (voice + audio rebuilt, committed to mine/<name>)
on:
  push:
    branches: [gemini-cartoon]
    paths: ['.github/workflows/mine-from-api.yml']     # only registers the workflow
  workflow_dispatch:
    inputs:
      name:
        description: "Script/result name (scripts/<name>.txt and results_api/<name>/)"
        default: railroads_test
      target:
        description: "Folder to create under mine/"
        default: railroads_v2

permissions:
  contents: write

jobs:
  make:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: for T in 1 2 3; do timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg && break; sleep 5; done
      - run: python -m pip install -q numpy pillow kokoro-onnx soundfile
      - uses: actions/cache@v4
        id: models
        with:
          path: models
          key: kokoro-v1.0
      - name: Kokoro voice model
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          for F in kokoro-v1.0.onnx voices-v1.0.bin; do curl -sSL --retry 4 -o "models/$F" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$F"; done
      - name: Rebuild the v1 project, voice and sound
        env:
          NAME: ${{ github.event.inputs.name }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          bash kit/tools/setup.sh "$PWD/project"
          cp kit/tools/mix.py kit/tools/audiolib.py kit/tools/timing.py project/ 2>/dev/null || true
          python tools/make_voice.py "scripts/$NAME.txt" project models
          (cd project && python3 timing.py voice.mp3 script.txt --out work)
          R="results_api/$NAME"
          cp "$R/web/story.js" "$R/web/main.js" "$R/web/roman.js" project/web/
          cp "$R/audio.py" project/audio.py
          cat project/web/toonbase.js project/web/roman.js > project/web/toon.js
          N=$(cd project && node -e "import('./web/story.js').then(m=>console.log(m.TOTAL))")
          echo "total frames $N"
          (cd project && FRAMES=$N python3 audio.py && python3 mix.py voice.mp3 music.wav sfx.wav && ls -la mix_raw.wav)
          D="mine/$TARGET"; mkdir -p "$D/web"
          cp project/web/*.js project/web/index.html "$D/web/"
          cp project/render.mjs project/mix_raw.wav project/voice.mp3 project/audio.py "$D/"
          cp project/work/words.json project/work/phrases.json "$D/" 2>/dev/null || true
          cp "$R/shot_notes.txt" "$R/PLAN.md" "$D/" 2>/dev/null || true
          rm -rf "$D/web/lib"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D"; git commit -q -m "mine/$TARGET from $NAME v1 [skip ci]" || exit 0
          for T in 1 2 3; do git pull -q --rebase -X theirs origin gemini-cartoon && git push -q origin HEAD:gemini-cartoon && break; sleep 10; done
