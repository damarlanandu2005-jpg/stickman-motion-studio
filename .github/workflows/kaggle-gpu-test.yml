name: Kaggle GPU WebGL test
on:
  workflow_dispatch:
  push:
    branches: [gemini-cartoon]
    paths: ['kaggle/gpu-webgl-test/**', '.github/workflows/kaggle-gpu-test.yml']
permissions:
  contents: write
concurrency:
  group: kaggle-gpu-test
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install Kaggle CLI
        run: python -m pip install kaggle==2.2.5 six
      - name: Push and wait
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -u
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then echo "MISSING KAGGLE SECRETS"; exit 1; fi
          U=$(echo "$KAGGLE_USERNAME" | tr -d '[:space:]')
          export KAGGLE_USERNAME="$U"; export KAGGLE_KEY=$(echo "$KAGGLE_KEY" | tr -d '[:space:]')
          sed -i "s/USERNAME/$U/" kaggle/gpu-webgl-test/kernel-metadata.json
          kaggle kernels push -p kaggle/gpu-webgl-test 2>&1 | tee push.txt
          for i in $(seq 1 120); do
            sleep 15
            S=$(kaggle kernels status "$U/webgl-gpu-test" 2>&1 | tail -1); echo "$i $S"
            case "$S" in *COMPLETE*|*ERROR*|*CANCEL*) break;; esac
          done
          mkdir -p out && kaggle kernels output "$U/webgl-gpu-test" -p out 2>&1 | tail -3 || true
          echo "===== LOG TAIL"; ls out; python - <<'PY'
          import json,glob
          for f in glob.glob('out/*.log'):
              try:
                  t=json.load(open(f))
                  txt=''.join(x.get('data','') for x in t)
              except Exception:
                  txt=open(f).read()
              print(txt[-6000:])
          for f in glob.glob('out/result.json'):
              print(open(f).read())
          PY
      - name: Save result to branch
        if: always()
        run: |
          mkdir -p results_kaggle
          cp out/result.json results_kaggle/gpu_webgl_result.json 2>/dev/null || echo '{"note":"no result.json"}' > results_kaggle/gpu_webgl_result.json
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout -- kaggle 2>/dev/null || true
          git add results_kaggle; git commit -m "Kaggle GPU WebGL result [skip ci]" || exit 0
          git pull --rebase -X theirs origin gemini-cartoon || true
          git push origin HEAD:gemini-cartoon || true
