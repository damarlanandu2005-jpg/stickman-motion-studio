name: Railroad Remotion shot QA

on:
  pull_request:
    branches: [gemini-cartoon]
    paths:
      - "mine/railroads_remotion/**"
      - ".github/workflows/railroad-remotion-qa.yml"
  workflow_dispatch:

concurrency:
  group: railroad-remotion-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shot-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: mine/railroads_remotion
          sparse-checkout-cone-mode: true
          ref: ${{ github.event.pull_request.head.sha || 'railroad-mromi-production' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Remotion and browser
        working-directory: mine/railroads_remotion
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Type-check the complete Remotion entry
        working-directory: mine/railroads_remotion
        run: |
          npx tsc --noEmit --jsx react-jsx --module ESNext --moduleResolution bundler \
            --target ES2022 --esModuleInterop --allowSyntheticDefaultImports \
            --skipLibCheck --strict false src/index.ts
      - name: Render the 19-shot QA strip in one browser session
        working-directory: mine/railroads_remotion
        env:
          COMP: RailShotQA
          REMOTION_GL: "swangle"
        run: |
          mkdir -p out/shot-qa
          CHROME="$(node -e "import('playwright').then(({chromium}) => console.log(chromium.executablePath()))")"
          export CHROME
          node render-qa.mjs
          ffmpeg -y -i out/shot-qa.mp4 -vsync 0 out/shot-qa/rail_%02d.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: railroad-remotion-shot-qa
          path: mine/railroads_remotion/out/shot-qa/
          retention-days: 7
