name: Feasibility test 2 - consistency with reference images
on:
  push:
    branches: [gemini-cartoon]
    paths: ['.github/workflows/video-test.yml']
  workflow_dispatch:
    inputs:
      out:
        description: "Result folder under results_video_test2/"
        default: t1
      models:
        description: "Comma list of video models to try, in order"
        default: "veo-3.1-fast-generate-001,veo-3.1-generate-001,veo-3.0-fast-generate-001,veo-3.0-generate-001,veo-2.0-generate-001"
permissions:
  contents: write
jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -q google-genai
      - name: Generate clips
        env:
          OUT: ${{ github.event.inputs.out }}
          VIDEO_MODELS: ${{ github.event.inputs.models }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          [ -n "$GCP_SA_KEY" ] && [ -n "$GCP_PROJECT_ID" ] || { echo "GCP secrets missing"; exit 1; }
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" GOOGLE_CLOUD_PROJECT="$GCP_PROJECT_ID" GOOGLE_GENAI_USE_VERTEXAI=true
          python tools/video_test2.py "results_video_test2/$OUT" || true
      - name: Commit results
        run: |
          git config user.name "claude-bot"; git config user.email "noreply@anthropic.com"
          git add results_video_test2
          git commit -m "video feasibility test results

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_016mB5dXU68XncSe2QQ1F8Qc" || exit 0
          git pull -q --rebase origin gemini-cartoon; git push -q origin HEAD:gemini-cartoon
