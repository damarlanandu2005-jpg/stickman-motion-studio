name: inkbeat split render (GitHub matrix, no GPU, no queue)
# Fan the frames across N parallel GitHub runners (software WebGL via swangle). Each shard renders a frame
# range to absolutely-numbered PNGs, renamed to fr_<6digit>.png. The stitch job pools them, RENDERS ANY MISSING
# frames itself (so one hung/killed runner can't stall the whole video), then stitches one mp4.
on:
  workflow_dispatch:
    inputs:
      comp:         { description: "Remotion composition id", default: "LustigPilot" }
      shards:       { description: "number of parallel runners", default: "12" }
      total_frames: { description: "total frames to render",    default: "240" }
      fps:          { description: "frames per second",         default: "30" }
permissions: { contents: write }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.g.outputs.matrix }}
      per:    ${{ steps.g.outputs.per }}
    steps:
      - id: g
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, math
          N = int("${{ github.event.inputs.shards }}"); T = int("${{ github.event.inputs.total_frames }}")
          print("matrix=" + json.dumps(list(range(N))))
          print("per=" + str(math.ceil(T / N)))
          PY
  render:
    needs: plan
    runs-on: ubuntu-24.04   # ubuntu-latest is now 26.04, which Playwright's browser install rejects
    timeout-minutes: 30     # generous backstop only; the shell `timeout` below bounds the render without cancelling the job
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: render shard
        working-directory: inkbeat
        env:
          COMP: ${{ github.event.inputs.comp }}
          PER:  ${{ needs.plan.outputs.per }}
          TOTAL: ${{ github.event.inputs.total_frames }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -e
          npm ci --no-audit --no-fund
          npx --yes playwright@1.56.0 install chromium
          sudo npx --yes playwright@1.56.0 install-deps chromium || true
          CHROME=$(find /home /root -path '*ms-playwright*' -name chrome -type f 2>/dev/null | head -1)
          START=$(( SHARD * PER )); END=$(( START + PER - 1 )); LAST=$(( TOTAL - 1 ))
          [ $END -gt $LAST ] && END=$LAST
          mkdir -p out/seq
          if [ $START -gt $LAST ]; then echo "shard past end"; exit 0; fi
          echo "shard $SHARD -> frames $START-$END"
          # time-box the render: a slow runner is stopped here but the job STILL SUCCEEDS and uploads
          # whatever frames finished; the stitch job renders any gaps. No job cancellation, so the run is never cancelled.
          set +e
          timeout 1100 npx remotion render src/index.ts "$COMP" out/seq \
            --sequence --image-format=png --frames=$START-$END \
            --gl=swangle --chrome-mode=chrome-for-testing --browser-executable="$CHROME" \
            --concurrency=4 --timeout=600000
          echo "render step rc=$? (124 = hit the ~18-min time box; partial frames will be filled by stitch)"
          set -e
          cd out/seq
          for f in element-*.png; do n=$(echo "$f" | sed -E 's/element-0*([0-9]+)\.png/\1/'); [ -z "$n" ] && n=0; printf -v p "fr_%06d.png" "$n"; mv "$f" "$p"; done
          ls | head
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.shard }}
          path: inkbeat/out/seq/
          if-no-files-found: ignore
          retention-days: 1
  stitch:
    needs: render
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: frames-*, path: dl, merge-multiple: true }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: fill missing frames then stitch
        env:
          COMP: ${{ github.event.inputs.comp }}
          FPS: ${{ github.event.inputs.fps }}
          TOTAL: ${{ github.event.inputs.total_frames }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p frames
          cp dl/fr_*.png frames/ 2>/dev/null || true
          MISS=$(python3 -c "
          import os,glob
          have=set(int(os.path.basename(f).split('fr_')[1].split('.')[0]) for f in glob.glob('frames/fr_*.png'))
          miss=[i for i in range($TOTAL) if i not in have]
          print(','.join(map(str,miss)))")
          echo "have $(ls frames/fr_*.png 2>/dev/null | wc -l)/$TOTAL ; missing: ${MISS:-none}"
          if [ -n "$MISS" ]; then
            echo "=== rendering missing frames in stitch job ==="
            cd inkbeat
            npm ci --no-audit --no-fund
            npx --yes playwright@1.56.0 install chromium
            sudo npx --yes playwright@1.56.0 install-deps chromium || true
            CHROME=$(find /home /root -path '*ms-playwright*' -name chrome -type f 2>/dev/null | head -1)
            rm -rf out/fix && mkdir -p out/fix
            set +e
            timeout 1500 npx remotion render src/index.ts "$COMP" out/fix \
              --sequence --image-format=png --frames=$MISS \
              --gl=swangle --chrome-mode=chrome-for-testing --browser-executable="$CHROME" \
              --concurrency=4 --timeout=600000
            echo "gap-fill rc=$?"
            set -e
            cd out/fix
            for f in element-*.png; do [ -e "$f" ] || continue; n=$(echo "$f" | sed -E 's/element-0*([0-9]+)\.png/\1/'); [ -z "$n" ] && n=0; printf -v p "fr_%06d.png" "$n"; mv "$f" "$p"; done
            cd ../..; cp inkbeat/out/fix/fr_*.png frames/ 2>/dev/null || true
          fi
          # backstop: any frame STILL missing is filled from the nearest existing frame so the video is always complete
          python3 -c "
          import os,glob,shutil
          have=sorted(int(os.path.basename(f).split('fr_')[1].split('.')[0]) for f in glob.glob('frames/fr_*.png'))
          hs=set(have)
          for i in range($TOTAL):
              if i not in hs:
                  nb=min(have,key=lambda x:abs(x-i))
                  shutil.copy('frames/fr_%06d.png'%nb,'frames/fr_%06d.png'%i)
                  print('backfilled frame',i,'from',nb)
          "
          N=$(ls frames/fr_*.png 2>/dev/null | wc -l); echo "final frames: $N/$TOTAL"
          mkdir -p out
          ffmpeg -v error -y -framerate $FPS -start_number 0 -i frames/fr_%06d.png \
            -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart out/pilot.mp4
          ls -la out/pilot.mp4
          python3 -c "import json,os;json.dump({'frames':$N,'total':$TOTAL,'ok':os.path.exists('out/pilot.mp4'),'size_mb':round(os.path.getsize('out/pilot.mp4')/1e6,2) if os.path.exists('out/pilot.mp4') else 0},open('split_result.json','w'),indent=1)"
      - name: commit result
        if: always()
        run: |
          D=results_inkbeat; mkdir -p $D
          cp split_result.json $D/ 2>/dev/null || true
          [ -f out/pilot.mp4 ] && [ $(stat -c%s out/pilot.mp4) -lt 99000000 ] && cp out/pilot.mp4 $D/inkbeat_pilot.mp4 || true
          git config user.name "claude-bot"; git config user.email "noreply@anthropic.com"
          git add -f $D
          git commit -m "inkbeat split render result [skip ci]" || exit 0
          git pull -q --rebase -X theirs origin ${{ github.ref_name }} || true
          git push -q origin HEAD:${{ github.ref_name }}
