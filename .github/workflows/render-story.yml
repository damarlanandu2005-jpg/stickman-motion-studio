name: Render story (one parallel job per shot)

# A story file (animation/stories/*.json) is turned into one scene file per shot by motion_studio/story.py
# (assets from the library, behavior rules from their type, environment presets, auto camera). Every shot renders
# on its own runner at the same time (CPU), then one job joins them in order and runs the reference QA script.
# Audio is paused: the video has no sound yet.
on:
  # the workflow file is not on main yet, so dispatch is not offered; a push to this test branch that changes the story or this file starts it
  push:
    branches: [test/image-to-3d-objects]
    paths: [".github/workflows/render-story.yml", "animation/stories/**"]
  workflow_dispatch:
    inputs:
      story:
        default: "animation/stories/space_adventure.json"
      width:
        default: "1080"
      height:
        default: "1920"

permissions:
  contents: write  # only used to publish results to the separate test-results branch

env:
  STORY: ${{ inputs.story || 'animation/stories/space_adventure.json' }}
  WIDTH: ${{ inputs.width || '1080' }}
  HEIGHT: ${{ inputs.height || '1920' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Library check, then build one scene per shot
        id: plan
        env:
          PYTHONPATH: .
        run: |
          python -m motion_studio.library check
          python -m motion_studio.story plan "$STORY" | tee plan.json
          python -m motion_studio.story build "$STORY" --out animation/scenes/story
          python3 - <<'PY'
          import json, os
          shots = json.load(open("animation/scenes/story/shots.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("matrix=" + json.dumps({"include": [{"shot": s["id"]} for s in shots]}) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: story-scenes
          path: animation/scenes/story/
          retention-days: 7

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FFmpeg (static release build, cached)
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1-latest-linux64-gpl-8.1
      - name: Install FFmpeg if not cached
        run: |
          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
              | tar -xJ -C "$HOME/ffmpeg" --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install headless Chromium
        run: |
          python -m pip install -q playwright==1.63.0
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: story-scenes
          path: animation/scenes/story
      - name: Render ${{ matrix.shot }}
        working-directory: animation
        run: |
          python render_frames.py --scene "scenes/story/${{ matrix.shot }}.json" --out "../shot" --width "$WIDTH" --height "$HEIGHT" \
            --video-name "${{ matrix.shot }}.mp4" --gl software
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-${{ matrix.shot }}
          path: shot/
          retention-days: 3

  merge:
    needs: [plan, render]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg (static release build, cached)
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1-latest-linux64-gpl-8.1
      - name: Install FFmpeg if not cached
        run: |
          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
              | tar -xJ -C "$HOME/ffmpeg" --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: shot-*
          path: shots
      - uses: actions/download-artifact@v4
        with:
          name: story-scenes
          path: story-scenes
      - name: Join the shots in story order and check the video
        run: |
          python3 -m pip install -q numpy pillow
          mkdir -p out
          python3 - <<'PY'
          import glob, hashlib, json, os, subprocess
          shots = json.load(open("story-scenes/shots.json"))
          fps = json.load(open(f"story-scenes/{shots[0]['scene']}"))["fps"]
          report = {"story": os.environ["STORY"], "shots": [], "status": "running", "problems": []}
          parts, expected = [], 0
          for s in shots:
              d = f"shots/shot-{s['id']}"
              rr = os.path.join(d, "render_report.json")
              info = json.load(open(rr)) if os.path.exists(rr) else {"status": "missing"}
              mp4 = glob.glob(os.path.join(d, f"{s['id']}.mp4"))
              frames = round(s["duration_s"] * fps)
              expected += frames
              report["shots"].append({"id": s["id"], "status": info.get("status"), "frames": info.get("frames_rendered"), "expected_frames": frames,
                                      "seconds_per_frame_mean": info.get("seconds_per_frame_mean"), "events": info.get("events"), "warnings": info.get("warnings"), "error": info.get("error")})
              if info.get("status") != "completed" or not mp4:
                  report["problems"].append(f"shot {s['id']} did not complete: {info.get('error')}")
              else:
                  parts.append(os.path.abspath(mp4[0]))
          if not report["problems"]:
              open("out/list.txt", "w").write("".join(f"file '{p}'\n" for p in parts))
              subprocess.run(["ffmpeg", "-v", "error", "-y", "-f", "concat", "-safe", "0", "-i", "out/list.txt", "-c", "copy", "-movflags", "+faststart", "out/render.mp4"], check=True)
              probe = json.loads(subprocess.run(["ffprobe", "-v", "error", "-count_frames", "-show_entries", "stream=codec_name,width,height,r_frame_rate,nb_read_frames:format=duration,size", "-of", "json", "out/render.mp4"], capture_output=True, text=True, check=True).stdout)
              v = probe["streams"][0]
              report["video"] = {"codec": v["codec_name"], "width": v["width"], "height": v["height"], "fps": v["r_frame_rate"], "frames": int(v["nb_read_frames"]),
                                 "duration_s": float(probe["format"]["duration"]), "bytes": int(probe["format"]["size"]), "sha256": hashlib.sha256(open("out/render.mp4", "rb").read()).hexdigest(), "audio": "none (paused)"}
              if report["video"]["frames"] != expected:
                  report["problems"].append(f"joined video has {report['video']['frames']} frames, expected {expected}")
          report["status"] = "completed" if not report["problems"] else "failed"
          json.dump(report, open("out/story_report.json", "w"), indent=2)
          print(json.dumps(report, indent=2))
          if report["problems"]:
              raise SystemExit("Story render failed: " + "; ".join(report["problems"]))
          PY
          python3 animation/reference/short_qa.py out/render.mp4 out/qa
          cat out/qa/report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-output
          path: out/
          retention-days: 14
      - name: Publish outputs to the test-results branch
        if: always()
        env:
          RUN_DIR: story-render/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ ! -f out/story_report.json ]; then echo "No outputs to publish"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin test-results
          git worktree add /tmp/results FETCH_HEAD
          cd /tmp/results && git checkout -B test-results
          mkdir -p "$RUN_DIR"
          cp -r "$GITHUB_WORKSPACE"/out/. "$RUN_DIR"/
          rm -f "$RUN_DIR/list.txt"
          find "$RUN_DIR" -type f -size +90M -print -delete
          git add "$RUN_DIR"
          git commit -q -m "Story render outputs, workflow run ${{ github.run_id }}"
          git push -q origin test-results
          echo "Published to branch test-results: $RUN_DIR"
