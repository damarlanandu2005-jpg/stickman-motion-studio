name: Kaggle AI script-writer model benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kaggle/ai-script-writer-benchmark/**"
      - "motion_studio/kaggle_runner.py"
      - ".github/workflows/kaggle-ai-script-writer-benchmark.yml"

concurrency:
  group: kaggle-ai-script-writer-model-benchmark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner-smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Kaggle runner modules compile
        run: python -m py_compile motion_studio/kaggle_runner.py motion_studio/imagecheck.py
      - name: Run script-writer output validation regression tests
        run: python -m unittest discover -s tests -p "test_script_writer_runner.py"

  script-writer-on-kaggle:
    needs: runner-smoke-check
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: |
          python -m pip install kaggle==2.2.5 six
          kaggle --version
      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Missing GitHub Actions secrets KAGGLE_USERNAME and/or KAGGLE_KEY"; exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path.home().joinpath(".kaggle", "kaggle.json").write_text(json.dumps({
              "username": os.environ["KAGGLE_USERNAME"].strip(),
              "key": os.environ["KAGGLE_KEY"].strip()}))
          PY
          chmod 600 "$HOME/.kaggle/kaggle.json"
      - name: Push, track and verify the script-writer benchmark
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          PYTHONPATH: .
        run: |
          python -m motion_studio.kaggle_runner \
            --kernel "$(echo "$KAGGLE_USERNAME" | tr -d '[:space:]')/stickman-motion-studio-ai-script-writer-benchmark" \
            --title "Stickman Motion Studio AI Script Writer Benchmark" \
            --kernel-dir kaggle/ai-script-writer-benchmark \
            --notebook ai_script_model_benchmark.ipynb \
            --out kaggle-ai-script-writer-output \
            --profile script-writer
      - name: Upload verified benchmark report, model outputs and execution record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-script-writer-model-benchmark
          path: kaggle-ai-script-writer-output/
          if-no-files-found: warn
          retention-days: 14
